[package]
name = "lumen"
version = "0.4.57"
edition = "2021"
description = "Lumen — браузер для Windows и Linux на Rust"

[dependencies]
tao = "0.30"
wry = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
urlencoding = "2"
dirs = "5"
base64 = "0.22"
tempfile = "3"
sha2 = "0.10"
ring = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
spki = { version = "0.7", features = ["std"] }
zip = { version = "9.5", default-features = false, features = ["deflate"] }
webview2-com = "0.33"
windows-core = "0.58"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }
cpal = "0.15"
winreg = "0.56"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
gtk = "0.18"
gdk = "0.18"
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }
[build-dependencies]
embed-resource = "3"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# GTK3 requires glib 0.18; backport the upstream VariantStrIter fix.
glib = { path = "vendor/glib" }

# Compatibility backports for the existing WebView and GTK3 stack.
tao = { path = "vendor/tao-0.30.8" }
selectors = { path = "vendor/selectors-0.22.0" }
phf_generator = { path = "vendor/phf_generator-0.8.0" }
glib-macros = { path = "vendor/glib-macros-0.18.5" }
gtk3-macros = { path = "vendor/gtk3-macros-0.18.2" }
