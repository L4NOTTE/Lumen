[package]
name = "lumen"
version = "0.1.0"
edition = "2021"
description = "Lumen — лаконичный браузер для Windows на Rust"

[dependencies]
tao = "0.30"
wry = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
urlencoding = "2"
dirs = "5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
