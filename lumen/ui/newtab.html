<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая вкладка</title>
<style>
  :root { --bg:#f8f9fb; --fg:#1f2328; --mute:#6b7280; --line:#d9dce2; --acc:#4f46e5; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --fg:#e6e7ea; --mute:#9aa0a6; --line:#33353b; --acc:#8b8dff; --card:#202226; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg);
    font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding-bottom:8vh; }
  h1 { margin:0; font-size:44px; font-weight:300; letter-spacing:.14em; }
  h1 b { color:var(--acc); font-weight:600; }
  form { width:min(560px,86vw); }
  input { width:100%; height:48px; padding:0 22px; font:inherit; font-size:16px; color:var(--fg);
    background:var(--card); border:1px solid var(--line); border-radius:24px; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus { border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); }
  p { margin:0; color:var(--mute); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1><b>L</b>UMEN</h1>
  <form action="https://lumen.invalid/s" method="get">
    <input name="q" placeholder="Поиск или адрес сайта" autofocus autocomplete="off" spellcheck="false">
  </form>
  <p>Быстро. Тихо. Без рекламы.</p>
</main>
</body>
</html>
