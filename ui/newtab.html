<!doctype html>
<html lang="ru" data-incognito="__INC__" data-theme="__THEME__" data-bg="__BGATTR__">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action https://lumen.invalid; base-uri 'none'; object-src 'none'">
<title>Новая вкладка</title>
<style>
  :root { --acc-l:#4f46e5; --acc-d:#8b8dff; --font:'Segoe UI Variable','Segoe UI',system-ui,sans-serif; --fs:13px;
          --bg:#f8f9fb; --fg:#1f2328; --mute:#6b7280; --line:#d9dce2; --acc:var(--acc-l); --card:#fff; --ease:cubic-bezier(.2,.8,.2,1); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --fg:#e6e7ea; --mute:#9aa0a6; --line:#33353b; --acc:var(--acc-d); --card:#202226; }
  }
  [data-theme="light"] { --bg:#f8f9fb; --fg:#1f2328; --mute:#6b7280; --line:#d9dce2; --acc:var(--acc-l); --card:#fff; }
  [data-theme="dark"]  { --bg:#16171a; --fg:#e6e7ea; --mute:#9aa0a6; --line:#33353b; --acc:var(--acc-d); --card:#202226; }
  [data-incognito="1"] { --bg:#120b1f; --fg:#ece6f7; --mute:#a99bc4; --line:#3a2d52; --acc:#b794f6; --card:#1c1330; }
  /* фон-картинка или градиент: светлый текст и «стеклянное» поле поиска */
  [data-bg="1"] { --fg:#fff; --mute:rgba(255,255,255,.82); --line:rgba(255,255,255,.35); --card:rgba(255,255,255,.16); --acc:#fff; }

  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  html { background:var(--bg); color:var(--fg); font-family:var(--font); font-size:calc(var(--fs) + 3px); }
  html[data-bg="1"] { background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.42)),var(--wallpaper),var(--bg);
    background-attachment:fixed; }
  main { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center;
    gap:clamp(14px,4vh,28px); padding:clamp(24px,20vh,210px) 12px 24px; font-weight:350; }
  main > * { animation:rise .55s var(--ease) both; }
  main > *:nth-child(2) { animation-delay:.08s; }
  main > *:nth-child(3) { animation-delay:.16s; }
  h1 { margin:0; font-size:3.2em; font-weight:300; letter-spacing:.14em; text-shadow:0 2px 18px rgba(0,0,0,.18); }
  h1 b { color:var(--acc); font-weight:600; }
  form { width:min(560px,86vw); }
  input { width:100%; height:3em; padding:0 1.4em; font:inherit; color:var(--fg);
    background:var(--card); border:1px solid var(--line); border-radius:2em; outline:none;
    transition:border-color .2s, box-shadow .25s, transform .25s var(--ease); }
  [data-bg="1"] input { backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  [data-bg="1"] input::placeholder { color:rgba(255,255,255,.75); }
  input:focus { border-color:var(--acc); transform:translateY(-1px);
    box-shadow:0 6px 24px color-mix(in srgb, var(--acc) 28%, transparent); }
  #search-slot { position:relative; z-index:2; flex:none; width:100%; height:calc(3em + 2px);
    display:grid; justify-items:center; align-items:start; }
  #search-form { --search-surface:var(--card); position:absolute; top:0;
    overflow:hidden; border:1px solid var(--line); border-radius:calc(1.5em + 1px); background:var(--card);
    transition:width .22s var(--ease), border-color .18s, background-color .22s, box-shadow .22s; }
  [data-bg="1"] #search-form { --search-surface:#24262b; backdrop-filter:blur(14px); }
  #search-form:focus-within { border-color:var(--acc); box-shadow:0 6px 24px color-mix(in srgb,var(--acc) 24%,transparent); }
  #search-form.open { width:min(584px,90vw); background:var(--search-surface); }
  .search-input { position:relative; }
  #search-field { display:block; padding-right:3em; border:0; border-radius:0; background:transparent; backdrop-filter:none; }
  #search-field:focus { transform:none; box-shadow:none; }
  #search-clear { position:absolute; inset-inline-end:10px; top:calc(50% - 16px); width:32px; height:32px;
    border:0; border-radius:50%; color:var(--mute); font:inherit; font-size:22px; line-height:1; background:transparent; cursor:pointer; }
  #search-clear[hidden] { display:none; }
  #search-clear:hover { background:color-mix(in srgb,var(--fg) 9%,transparent); color:var(--fg); }
  #search-clear:focus-visible { outline:2px solid var(--acc) !important; outline-offset:-2px; }
  #search-drop { display:grid; grid-template-rows:0fr; min-height:0;
    visibility:hidden; opacity:0; pointer-events:none;
    transition:grid-template-rows .22s var(--ease), opacity .16s, visibility 0s linear .22s; }
  #search-form.open #search-drop { grid-template-rows:1fr; visibility:visible; opacity:1; pointer-events:auto; transition-delay:0s; }
  #search-drop > div { min-height:0; overflow:hidden; }
  #search-suggestions { position:relative; max-height:var(--suggestion-height,199px); overflow:auto; padding:2px 7px 7px;
    overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:color-mix(in srgb,var(--fg) 38%,transparent) transparent; }
  .search-option { border-radius:14px; padding-inline:calc(1.4em - 5px); line-height:38px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; font-size:.9em; }
  .search-option:hover, .search-option[aria-selected="true"] { background:color-mix(in srgb,var(--acc) 15%,transparent); }
  p { margin:0; color:var(--mute); font-size:.82em; text-align:center; line-height:1.5; }
  /* быстрые ссылки */
  #tiles { width:min(780px,92vw); display:grid; grid-template-columns:repeat(auto-fill,92px); gap:16px 14px; justify-content:center; }
  .tile { position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; width:92px; padding:10px 4px 8px; border:0;
    border-radius:16px; background:transparent; color:var(--fg); text-decoration:none; cursor:pointer; font:inherit; font-size:.82em;
    transition:background-color .18s, transform .18s var(--ease); animation:rise .45s var(--ease) both; }
  .tile:hover { background:color-mix(in srgb, var(--fg) 10%, transparent); transform:translateY(-2px); }
  [data-bg="1"] .tile:hover { background:rgba(255,255,255,.18); }
  .ic { position:relative; width:56px; height:56px; border-radius:15px; display:grid; place-items:center; overflow:hidden;
    color:#fff; font-size:1.6em; font-weight:600; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .ic.has-icon { background:#373a44 !important; color:transparent; }
  .ic.has-icon.icon-light-plate { background:#e8ebf2 !important; }
  .ic img { position:absolute; inset:0; margin:auto; width:64%; height:64%; object-fit:contain; }
  .ic img.icon-small { image-rendering:pixelated; }
  .ic:not(.has-icon) img { opacity:0; }
  .nm { max-width:88px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; text-shadow:0 1px 6px rgba(0,0,0,.25); }
  .add .ic { background:color-mix(in srgb, var(--fg) 14%, transparent); color:var(--fg); box-shadow:none; font-size:1.9em; font-weight:300; }
  [data-bg="1"] .add .ic { background:rgba(255,255,255,.2); }
  .del { position:absolute; top:2px; right:6px; width:20px; height:20px; border:0; border-radius:50%; background:rgba(0,0,0,.55); color:#fff;
    font-size:11px; line-height:20px; cursor:pointer; opacity:0; transition:opacity .15s; }
  .tile:hover .del { opacity:1; }
  #dlg { position:fixed; inset:0; z-index:5; display:grid; place-items:center; background:rgba(0,0,0,.45); backdrop-filter:blur(4px);
    animation:fade .2s ease both; }
  #dlg[hidden] { display:none; }
  #dlg form { width:min(380px,90vw); padding:22px; border-radius:18px; background:var(--card); color:var(--fg); box-shadow:0 18px 60px rgba(0,0,0,.4);
    animation:rise .3s var(--ease) both; }
  [data-bg="1"] #dlg form { background:#1c1d22; color:#fff; --line:rgba(255,255,255,.2); --mute:rgba(255,255,255,.7); }
  #dlg h2 { margin:0 0 14px; font-size:1.25em; font-weight:600; }
  #dlg input { height:2.6em; margin-bottom:10px; border-radius:10px; padding:0 14px; background:transparent; backdrop-filter:none; }
  #dlg .btns { display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
  #dlg button { height:2.4em; padding:0 18px; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; font:inherit; cursor:pointer;
    transition:background-color .15s, transform .1s; }
  #dlg button:active { transform:scale(.96); }
  #dlg button.ok { background:var(--acc); border-color:var(--acc); color:#fff; }
  [data-bg="1"] #dlg button.ok { background:#fff; color:#111; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  html[data-platform="linux"] main > *, html[data-platform="linux"] .tile,
  html[data-platform="linux"] #dlg, html[data-platform="linux"] #dlg form { animation:none; }
  html[data-platform="linux"] input, html[data-platform="linux"] #search-form,
  html[data-platform="linux"] #dlg { backdrop-filter:none; -webkit-backdrop-filter:none; }
  html[data-platform="linux"] #search-form, html[data-platform="linux"] #search-drop { transition:none; }
  html[data-platform="linux"] #search-form:focus-within { box-shadow:none; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  h1 { font-size:clamp(30px,7vw,52px); }
  h1 b { font-weight:450; }
  #tiles { max-width:100%; }
  #dlg { overflow:auto; padding:16px; }
  @media(max-height:500px) { .ic{width:44px;height:44px;border-radius:12px}.tile{gap:5px;padding:6px 4px}main{gap:14px;padding-block:18px 12px} }
  @media(max-height:360px) { main{gap:10px;padding-top:8px} h1{font-size:26px} }
</style>
<style id="vars">/*__VARS__*/</style>
<style id="bgcss">/*__BGCSS__*/</style>
<style>button,button:hover,button:active,button:focus{transform:none!important;transition:none!important;outline:none!important;box-shadow:none!important}.tile:hover{transform:none!important;background:transparent!important}</style></head>
<body>
<main>
  <h1><b>L</b>UMEN</h1>
  <div id="search-slot">
    <form id="search-form" action="https://lumen.invalid/s" method="get">
      <input type="hidden" name="nonce" value="__NEWTAB_TOKEN__">
      <div class="search-input">
        <input id="search-field" name="q" placeholder="Поиск или адрес сайта" aria-label="Поиск или адрес сайта"
          role="combobox" aria-autocomplete="list" aria-controls="search-suggestions" aria-expanded="false" autofocus autocomplete="off" spellcheck="false">
        <button id="search-clear" type="button" aria-label="Очистить поиск" hidden>×</button>
      </div>
      <div id="search-drop" aria-hidden="true"><div><div id="search-suggestions" role="listbox" aria-label="Поисковые подсказки"></div></div></div>
    </form>
  </div>
  <div id="tiles"></div>
  <p id="t"></p>
</main>
<div id="dlg" hidden>
  <form id="dform" autocomplete="off">
    <h2>Новая быстрая ссылка</h2>
    <input id="dn" placeholder="Название (необязательно)" spellcheck="false">
    <input id="du" placeholder="Адрес сайта, например example.com" spellcheck="false">
    <div class="btns"><button type="button" id="dc">Отмена</button><button type="submit" class="ok">Добавить</button></div>
  </form>
</div>
<script type="application/json" id="lumen-links">/*__LINKS__*/[]</script>
<script type="application/json" id="lumen-recent-searches">[]</script>
<script>
  const LINKS = JSON.parse(document.getElementById('lumen-links').textContent);
  const INC = document.documentElement.dataset.incognito === '1';
  document.getElementById('t').innerHTML = INC
    ? '🕶 Режим инкогнито<br>История, куки и кэш не сохраняются и удаляются после закрытия окна'
    : 'Быстро. Тихо. Без рекламы.';

  const token = document.querySelector('input[name="nonce"]').value;
  const linuxIpc = document.documentElement.dataset.platform === 'linux' && window.ipc;
  const cmd = (path, params) => {
    const target = 'https://lumen.invalid/' + path + '?' + new URLSearchParams({...params, nonce: token});
    if (linuxIpc) linuxIpc.postMessage(target);
    else location.href = target;
  };
  const searchForm = document.getElementById('search-form');
  const searchField = document.getElementById('search-field');
  const searchClear = document.getElementById('search-clear');
  const searchDrop = document.getElementById('search-drop');
  const suggestionList = document.getElementById('search-suggestions');
  const searchSlot = document.getElementById('search-slot');
  const recentSearches = INC ? [] : JSON.parse(document.getElementById('lumen-recent-searches').textContent);
  let suggestions = [], selected = -1;

  function fitSuggestions() {
    if (!searchForm.classList.contains('open')) return;
    const rowHeight = suggestionList.firstElementChild.offsetHeight;
    const insets = 9;
    const available = innerHeight + scrollY - searchSlot.offsetTop - searchSlot.offsetHeight - 12;
    const rows = Math.max(1, Math.min(10, Math.floor((available - insets) / rowHeight)));
    suggestionList.style.setProperty('--suggestion-height', `${rows * rowHeight + insets}px`);
  }

  function selectSuggestion(index) {
    if (selected >= 0) suggestionList.children[selected]?.setAttribute('aria-selected', 'false');
    selected = index;
    const option = suggestionList.children[index];
    if (!option) { searchField.removeAttribute('aria-activedescendant'); return; }
    option.setAttribute('aria-selected', 'true');
    searchField.setAttribute('aria-activedescendant', option.id);
    const bottom = option.offsetTop + option.offsetHeight - suggestionList.clientHeight;
    suggestionList.scrollTop = Math.min(option.offsetTop, Math.max(bottom, suggestionList.scrollTop));
  }

  function showSuggestions(open) {
    searchForm.classList.toggle('open', open);
    searchField.setAttribute('aria-expanded', String(open));
    searchDrop.setAttribute('aria-hidden', String(!open));
    if (!open) selectSuggestion(-1);
  }

  function updateSuggestions() {
    searchClear.hidden = !searchField.value;
    const input = searchField.value.trim();
    if (!input) { showSuggestions(false); return; }
    const query = input.toLowerCase();
    const matches = recentSearches.filter(text => {
      const normalized = text.toLowerCase();
      return normalized !== query && normalized.startsWith(query);
    });
    if (!matches.length) { showSuggestions(false); return; }
    selectSuggestion(-1);
    if (matches.length !== suggestions.length || matches.some((text, index) => text !== suggestions[index])) {
      suggestions = matches;
      suggestionList.replaceChildren(...suggestions.map((text, index) => {
        const option = document.createElement('div');
        option.className = 'search-option';
        option.id = `search-option-${index}`;
        option.dataset.index = index;
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', 'false');
        option.textContent = text;
        return option;
      }));
    }
    showSuggestions(true);
    fitSuggestions();
    suggestionList.scrollTop = 0;
  }

  addEventListener('resize', fitSuggestions);
  addEventListener('scroll', fitSuggestions, {passive:true});
  searchField.addEventListener('input', updateSuggestions);
  searchField.addEventListener('focus', updateSuggestions);
  searchField.addEventListener('blur', () => showSuggestions(false));
  searchClear.addEventListener('pointerdown', event => event.preventDefault());
  searchClear.addEventListener('click', () => {
    searchField.value = '';
    searchField.focus();
    updateSuggestions();
  });
  searchField.addEventListener('keydown', event => {
    if (event.isComposing || !searchForm.classList.contains('open')) return;
    if (event.key === 'Escape') { event.preventDefault(); showSuggestions(false); return; }
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
    event.preventDefault();
    const next = event.key === 'ArrowDown' ? selected + 1 : selected < 0 ? suggestions.length - 1 : selected - 1;
    selectSuggestion((next + suggestions.length) % suggestions.length);
  });
  suggestionList.addEventListener('pointerdown', event => { if (event.target.closest('.search-option')) event.preventDefault(); });
  suggestionList.addEventListener('click', event => {
    const option = event.target.closest('.search-option');
    if (!option || !searchForm.classList.contains('open')) return;
    selectSuggestion(Number(option.dataset.index));
    searchForm.requestSubmit();
  });
  searchForm.addEventListener('submit', event => {
    if (selected >= 0) searchField.value = suggestions[selected];
    if (!searchField.value.trim()) { event.preventDefault(); return; }
    showSuggestions(false);
    if (linuxIpc) {
      event.preventDefault();
      cmd('s', {q: searchField.value});
    }
  });
  const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const tiles = document.getElementById('tiles');
  const tileIcons = new Map();
  const iconCanvas = document.createElement('canvas');
  iconCanvas.width = iconCanvas.height = 12;
  const iconPixels = iconCanvas.getContext('2d', {willReadFrequently:true});
  function needsLightPlate(image) {
    if (!iconPixels) return false;
    iconPixels.clearRect(0, 0, 12, 12);
    iconPixels.drawImage(image, 0, 0, 12, 12);
    const pixels = iconPixels.getImageData(0, 0, 12, 12).data;
    let brightness = 0, visible = 0;
    for (let i = 0; i < pixels.length; i += 4) {
      if (pixels[i + 3] < 96) continue;
      brightness += .2126 * pixels[i] + .7152 * pixels[i + 1] + .0722 * pixels[i + 2];
      visible++;
    }
    return visible > 0 && brightness / visible < 88;
  }
  function setTileIcon(tile, source) {
    const previous = tile.querySelector('img');
    if (previous && previous.getAttribute('src') === source) return;
    previous?.remove();
    tile.classList.remove('has-icon', 'icon-light-plate');
    if (typeof source !== 'string' || !/^data:image\/png;base64,[A-Za-z0-9+/=]{1,13656}$/.test(source)) return;
    const image = document.createElement('img');
    image.alt = '';
    image.decoding = 'async';
    image.loading = 'lazy';
    image.onload = () => {
      if (image.parentElement !== tile) return;
      if (Math.max(image.naturalWidth, image.naturalHeight) < 32) {
        image.classList.add('icon-small');
        const scale = Math.min(2, Math.floor(36 / Math.max(image.naturalWidth, image.naturalHeight)));
        image.style.maxWidth = (image.naturalWidth * scale) + 'px';
        image.style.maxHeight = (image.naturalHeight * scale) + 'px';
      }
      try { tile.classList.toggle('icon-light-plate', needsLightPlate(image)); } catch (_) {}
      tile.classList.add('has-icon');
    };
    image.onerror = () => image.remove();
    image.src = source;
    tile.append(image);
  }
  window.updateLinkIcons = icons => {
    for (const [id, tile] of tileIcons) setTileIcon(tile, icons[id]);
  };
  if (!INC) {
    LINKS.forEach((l, i) => {
      let host = '';
      try { host = new URL(l.u).hostname.replace(/^www\./, ''); } catch (_) {}
      const a = document.createElement('a'); a.className = 'tile'; a.href = l.u; a.title = l.u;
      a.addEventListener('mousedown', event => { if (event.button === 1) event.preventDefault(); });
      a.addEventListener('auxclick', event => {
        if (event.button !== 1 || !event.isTrusted || event.target.closest('.del')) return;
        event.preventDefault();
        cmd('open-background', { u: l.u });
      });
      a.style.animationDelay = (i * 25) + 'ms';
      const ic = document.createElement('span'); ic.className = 'ic';
      ic.style.background = `linear-gradient(135deg,hsl(${hue(host)},62%,52%),hsl(${(hue(host) + 40) % 360},62%,42%))`;
      ic.textContent = (l.t || host || '?').trim().charAt(0).toUpperCase();
      tileIcons.set(l.i ?? i, ic);
      setTileIcon(ic, l.icon);
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = l.t || host;
      const del = document.createElement('button'); del.className = 'del'; del.type = 'button'; del.textContent = '✕'; del.title = 'Удалить';
      del.onclick = (e) => { e.preventDefault(); e.stopPropagation(); cmd('del', { i: l.i ?? i }); };
      a.append(ic, nm, del); tiles.append(a);
    });
    const add = document.createElement('button'); add.className = 'tile add'; add.type = 'button';
    add.style.animationDelay = (LINKS.length * 25) + 'ms';
    add.innerHTML = '<span class="ic">+</span><span class="nm">Добавить</span>';
    add.onclick = () => { dlg.hidden = false; dn.value = ''; du.value = ''; du.focus(); };
    tiles.append(add);
  }
  const dlg = document.getElementById('dlg'), dn = document.getElementById('dn'), du = document.getElementById('du');
  document.getElementById('dc').onclick = () => { dlg.hidden = true; };
  dlg.onclick = (e) => { if (e.target === dlg) dlg.hidden = true; };
  addEventListener('keydown', (e) => { if (e.key === 'Escape') dlg.hidden = true; });
  document.getElementById('dform').onsubmit = (e) => {
    e.preventDefault();
    if (!du.value.trim()) { du.focus(); return; }
    dlg.hidden = true;
    cmd('add', { t: dn.value, u: du.value });
  };
</script>
<script>function removeNativeHints(root) {
  const elements = root.nodeType === 1 ? [root, ...root.querySelectorAll('[title]')] : [...root.querySelectorAll('[title]')];
  for (const el of elements) {
    const text = el.getAttribute('title');
    if (text === null) continue;
    if (text) { el.setAttribute('aria-label', text); el.setAttribute('data-hint', text); }
    el.removeAttribute('title');
  }
}
removeNativeHints(document);
new MutationObserver(records => { for (const r of records) { if (r.type === 'attributes') removeNativeHints(r.target); else r.addedNodes.forEach(n => { if (n.nodeType === 1) removeNativeHints(n); }); } }).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['title']});
</script></body>
</html>
