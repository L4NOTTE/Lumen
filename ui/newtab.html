<!doctype html>
<html lang="ru" data-incognito="__INC__" data-theme="__THEME__" data-bg="__BGATTR__">
<head>
<meta charset="utf-8">
<title>Новая вкладка</title>
<style>
  :root { --acc-l:#4f46e5; --acc-d:#8b8dff; --font:'Segoe UI Variable','Segoe UI',system-ui,sans-serif; --fs:13px;
          --bg:#f8f9fb; --fg:#1f2328; --mute:#6b7280; --line:#d9dce2; --acc:var(--acc-l); --card:#fff; --ease:cubic-bezier(.2,.8,.2,1); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --fg:#e6e7ea; --mute:#9aa0a6; --line:#33353b; --acc:var(--acc-d); --card:#202226; }
  }
  [data-theme="light"] { --bg:#f8f9fb; --fg:#1f2328; --mute:#6b7280; --line:#d9dce2; --acc:var(--acc-l); --card:#fff; }
  [data-theme="dark"]  { --bg:#16171a; --fg:#e6e7ea; --mute:#9aa0a6; --line:#33353b; --acc:var(--acc-d); --card:#202226; }
  [data-incognito="1"] { --bg:#120b1f; --fg:#ece6f7; --mute:#a99bc4; --line:#3a2d52; --acc:#b794f6; --card:#1c1330; }
  /* фон-картинка или градиент: светлый текст и «стеклянное» поле поиска */
  [data-bg="1"] { --fg:#fff; --mute:rgba(255,255,255,.82); --line:rgba(255,255,255,.35); --card:rgba(255,255,255,.16); --acc:#fff; }

  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:calc(var(--fs) + 3px); }
  [data-bg="1"] body::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.42)); }
  main { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding-bottom:8vh; }
  main > * { animation:rise .55s var(--ease) both; }
  main > *:nth-child(2) { animation-delay:.08s; }
  main > *:nth-child(3) { animation-delay:.16s; }
  h1 { margin:0; font-size:3.2em; font-weight:300; letter-spacing:.14em; text-shadow:0 2px 18px rgba(0,0,0,.18); }
  h1 b { color:var(--acc); font-weight:600; }
  form { width:min(560px,86vw); }
  input { width:100%; height:3em; padding:0 1.4em; font:inherit; color:var(--fg);
    background:var(--card); border:1px solid var(--line); border-radius:2em; outline:none;
    transition:border-color .2s, box-shadow .25s, transform .25s var(--ease); }
  [data-bg="1"] input { backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  [data-bg="1"] input::placeholder { color:rgba(255,255,255,.75); }
  input:focus { border-color:var(--acc); transform:translateY(-1px);
    box-shadow:0 6px 24px color-mix(in srgb, var(--acc) 28%, transparent); }
  p { margin:0; color:var(--mute); font-size:.82em; text-align:center; line-height:1.5; }
  /* быстрые ссылки */
  #tiles { width:min(780px,92vw); display:grid; grid-template-columns:repeat(auto-fill,92px); gap:16px 14px; justify-content:center; }
  .tile { position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; width:92px; padding:10px 4px 8px; border:0;
    border-radius:16px; background:transparent; color:var(--fg); text-decoration:none; cursor:pointer; font:inherit; font-size:.82em;
    transition:background-color .18s, transform .18s var(--ease); animation:rise .45s var(--ease) both; }
  .tile:hover { background:color-mix(in srgb, var(--fg) 10%, transparent); transform:translateY(-2px); }
  [data-bg="1"] .tile:hover { background:rgba(255,255,255,.18); }
  .ic { position:relative; width:56px; height:56px; border-radius:15px; display:grid; place-items:center; overflow:hidden;
    color:#fff; font-size:1.6em; font-weight:600; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .ic img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#fff; padding:9px; }
  .nm { max-width:88px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; text-shadow:0 1px 6px rgba(0,0,0,.25); }
  .add .ic { background:color-mix(in srgb, var(--fg) 14%, transparent); color:var(--fg); box-shadow:none; font-size:1.9em; font-weight:300; }
  [data-bg="1"] .add .ic { background:rgba(255,255,255,.2); }
  .del { position:absolute; top:2px; right:6px; width:20px; height:20px; border:0; border-radius:50%; background:rgba(0,0,0,.55); color:#fff;
    font-size:11px; line-height:20px; cursor:pointer; opacity:0; transition:opacity .15s; }
  .tile:hover .del { opacity:1; }
  #dlg { position:fixed; inset:0; z-index:5; display:grid; place-items:center; background:rgba(0,0,0,.45); backdrop-filter:blur(4px);
    animation:fade .2s ease both; }
  #dlg[hidden] { display:none; }
  #dlg form { width:min(380px,90vw); padding:22px; border-radius:18px; background:var(--card); color:var(--fg); box-shadow:0 18px 60px rgba(0,0,0,.4);
    animation:rise .3s var(--ease) both; }
  [data-bg="1"] #dlg form { background:#1c1d22; color:#fff; --line:rgba(255,255,255,.2); --mute:rgba(255,255,255,.7); }
  #dlg h2 { margin:0 0 14px; font-size:1.25em; font-weight:600; }
  #dlg input { height:2.6em; margin-bottom:10px; border-radius:10px; padding:0 14px; background:transparent; backdrop-filter:none; }
  #dlg .btns { display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
  #dlg button { height:2.4em; padding:0 18px; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; font:inherit; cursor:pointer;
    transition:background-color .15s, transform .1s; }
  #dlg button:active { transform:scale(.96); }
  #dlg button.ok { background:var(--acc); border-color:var(--acc); color:#fff; }
  [data-bg="1"] #dlg button.ok { background:#fff; color:#111; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  main { min-height:100%; height:auto; gap:clamp(14px,4vh,28px); padding:clamp(20px,6vh,70px) 12px; }
  h1 { font-size:clamp(30px,7vw,52px); }
  #tiles { max-width:100%; }
  #dlg { overflow:auto; padding:16px; }
  @media(max-height:500px) { .ic{width:44px;height:44px;border-radius:12px}.tile{gap:5px;padding:6px 4px}main{gap:14px} }
</style>
<style id="vars">/*__VARS__*/</style>
<style id="bgcss">/*__BGCSS__*/</style>
</head>
<body>
<main>
  <h1><b>L</b>UMEN</h1>
  <form action="https://lumen.invalid/s" method="get">
    <input name="q" placeholder="Поиск или адрес сайта" autofocus autocomplete="off" spellcheck="false">
  </form>
  <div id="tiles"></div>
  <p id="t"></p>
</main>
<div id="dlg" hidden>
  <form id="dform" autocomplete="off">
    <h2>Новая быстрая ссылка</h2>
    <input id="dn" placeholder="Название (необязательно)" spellcheck="false">
    <input id="du" placeholder="Адрес сайта, например example.com" spellcheck="false">
    <div class="btns"><button type="button" id="dc">Отмена</button><button type="submit" class="ok">Добавить</button></div>
  </form>
</div>
<script>
  const LINKS = /*__LINKS__*/[];
  const INC = document.documentElement.dataset.incognito === '1';
  document.getElementById('t').innerHTML = INC
    ? '🕶 Режим инкогнито<br>История, куки и кэш не сохраняются и удаляются после закрытия окна'
    : 'Быстро. Тихо. Без рекламы.';

  const cmd = (path, params) => { location.href = 'https://lumen.invalid/' + path + '?' + new URLSearchParams(params).toString(); };
  const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const tiles = document.getElementById('tiles');
  if (!INC) {
    LINKS.forEach((l, i) => {
      let host = '';
      try { host = new URL(l.u).hostname.replace(/^www\./, ''); } catch (_) {}
      const a = document.createElement('a'); a.className = 'tile'; a.href = l.u; a.title = l.u;
      a.style.animationDelay = (i * 25) + 'ms';
      const ic = document.createElement('span'); ic.className = 'ic';
      ic.style.background = `linear-gradient(135deg,hsl(${hue(host)},62%,52%),hsl(${(hue(host) + 40) % 360},62%,42%))`;
      ic.textContent = (l.t || host || '?').trim().charAt(0).toUpperCase();
      const img = new Image(); img.alt = ''; img.src = 'https://' + host + '/favicon.ico';
      img.onload = () => { if (img.naturalWidth > 15) ic.append(img); };
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = l.t || host;
      const del = document.createElement('button'); del.className = 'del'; del.type = 'button'; del.textContent = '✕'; del.title = 'Удалить';
      del.onclick = (e) => { e.preventDefault(); e.stopPropagation(); cmd('del', { i }); };
      a.append(ic, nm, del); tiles.append(a);
    });
    const add = document.createElement('button'); add.className = 'tile add'; add.type = 'button';
    add.style.animationDelay = (LINKS.length * 25) + 'ms';
    add.innerHTML = '<span class="ic">+</span><span class="nm">Добавить</span>';
    add.onclick = () => { dlg.hidden = false; dn.value = ''; du.value = ''; du.focus(); };
    tiles.append(add);
  }
  const dlg = document.getElementById('dlg'), dn = document.getElementById('dn'), du = document.getElementById('du');
  document.getElementById('dc').onclick = () => { dlg.hidden = true; };
  dlg.onclick = (e) => { if (e.target === dlg) dlg.hidden = true; };
  addEventListener('keydown', (e) => { if (e.key === 'Escape') dlg.hidden = true; });
  document.getElementById('dform').onsubmit = (e) => {
    e.preventDefault();
    if (!du.value.trim()) { du.focus(); return; }
    dlg.hidden = true;
    cmd('add', { t: dn.value, u: du.value });
  };
</script>
</body>
</html>
